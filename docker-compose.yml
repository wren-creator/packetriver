name: packetcreek

# Packet Creek: a small town you attack for a high score. This base file is the
# FLAT topology: every deliberate weakness is on. Fold in
# docker-compose.segmented.yml (./start.sh --segmented) for the hardened town.
#
# Every published port binds to 127.0.0.1. start.sh refuses to launch otherwise
# and status.sh re-audits. it-net, ot-net, and bus-net are internal so nothing
# on them can reach the internet.
#
# Phase 0 scaffold: gateway + simmap + scoring + bus. The vulnerable target
# districts (shops, city hall, utilities, traffic, rail) land in later phases.

x-common: &common
  restart: unless-stopped
  init: true

services:

  # --- the one way in: vhost routing + reverse proxy ---------------------
  gateway:
    <<: *common
    build: ./gateway
    container_name: packetcreek-gateway
    depends_on:
      simmap:  { condition: service_healthy }
      scoring: { condition: service_healthy }
    ports:
      - "127.0.0.1:8080:80"
    networks: [edge-net, it-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://simmap:8000/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  # --- the sim + the map + the realtime feed, one process ---------------
  simmap:
    <<: *common
    build: ./simmap
    container_name: packetcreek-simmap
    depends_on:
      bus: { condition: service_healthy }
    environment:
      TICK_SECONDS: "${TICK_SECONDS:-1.0}"
      DONATION_CASHAPP: "${DONATION_CASHAPP:-britleywren}"
      MQTT_HOST: "bus"
    networks: [it-net, bus-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  # --- the only component that knows the flags -------------------------
  scoring:
    <<: *common
    build: ./scoring
    container_name: packetcreek-scoring
    depends_on:
      bus: { condition: service_healthy }
    environment:
      MQTT_HOST: "bus"
    volumes:
      - scoring-data:/data
    networks: [it-net, bus-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  # --- event bus AND a deliberately-open MQTT target ------------------
  # On edge-net as well so its published port has a route back from the host
  # (a container attached only to internal networks cannot publish reliably).
  bus:
    <<: *common
    image: eclipse-mosquitto:2
    container_name: packetcreek-bus
    volumes:
      - ./bus/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:1883:1883"
    networks: [bus-net, it-net, edge-net]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t healthcheck -m ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

networks:
  edge-net:
    driver: bridge
    ipam: { config: [{ subnet: 172.31.10.0/24 }] }
  it-net:
    driver: bridge
    internal: true
    ipam: { config: [{ subnet: 172.31.20.0/24 }] }
  bus-net:
    driver: bridge
    internal: true
    ipam: { config: [{ subnet: 172.31.40.0/24 }] }

volumes:
  scoring-data:
