name: packetriver

# Packet River: a small town you attack for a high score. This base file is the
# FLAT topology: every deliberate weakness is on. Fold in
# docker-compose.segmented.yml (./start.sh --segmented) for the hardened town.
#
# Every published port binds to 127.0.0.1. start.sh refuses to launch otherwise
# and status.sh re-audits. it-net, ot-net, and bus-net are internal so nothing
# on them can reach the internet.
#
# Phase 1: gateway + simmap + scoring + bus, plus the first real target
# district - the General Store (websites + db) behind its login portal - and
# the boxed-in player box. More districts land in later phases.

x-common: &common
  restart: unless-stopped
  init: true

services:

  # --- the one way in: vhost routing + reverse proxy ---------------------
  gateway:
    <<: *common
    build: ./gateway
    container_name: packetriver-gateway
    depends_on:
      simmap:  { condition: service_healthy }
      scoring: { condition: service_healthy }
    ports:
      - "127.0.0.1:8080:80"
    networks: [edge-net, it-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://simmap:8000/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  # --- the sim + the map + the realtime feed, one process ---------------
  simmap:
    <<: *common
    build: ./simmap
    container_name: packetriver-simmap
    depends_on:
      bus:       { condition: service_healthy }
      field-plc: { condition: service_healthy }
    environment:
      TICK_SECONDS: "${TICK_SECONDS:-1.0}"
      DONATION_CASHAPP: "${DONATION_CASHAPP:-britleywren}"
      MQTT_HOST: "bus"
      FIELD_PLC_HOST: "field-plc"
    networks: [it-net, bus-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  # --- the only component that knows the flags -------------------------
  scoring:
    <<: *common
    build: ./scoring
    container_name: packetriver-scoring
    depends_on:
      bus: { condition: service_healthy }
    environment:
      MQTT_HOST: "bus"
      SESSION_SECRET: "${SESSION_SECRET:-packet-river-dev-secret}"
    volumes:
      - scoring-data:/data
      - pkt-flags:/run/secret          # writes each target's flag here for it to plant
    networks: [it-net, bus-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  # --- the vulnerable Main Street storefronts (Phase 1: General Store) ---
  db:
    <<: *common
    image: mariadb:11
    container_name: packetriver-db
    command: ["--innodb-buffer-pool-size=64M", "--local-infile=1"]
    environment:
      MARIADB_ROOT_PASSWORD: "root"
      MARIADB_DATABASE: "generalstore"
      MARIADB_USER: "shop"
      MARIADB_PASSWORD: "shop"
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init/generalstore.sql:/docker-entrypoint-initdb.d/10-generalstore.sql:ro
      - ./db/my.cnf:/etc/mysql/conf.d/packetriver.cnf:ro
    networks: [it-net]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h127.0.0.1 -uroot -proot --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  websites:
    <<: *common
    build: ./websites
    container_name: packetriver-websites
    depends_on:
      db:      { condition: service_healthy }
      scoring: { condition: service_healthy }
    environment:
      DB_HOST: "db"
      DB_NAME: "generalstore"
      DB_USER: "shop"
      DB_PASS: "shop"
      VERBOSE_ERRORS: "${VERBOSE_ERRORS:-1}"
    volumes:
      - pkt-flags:/run/secret:ro       # Phase 3 tightens this to a per-target subpath
    ports:
      - "127.0.0.1:8090:80"
    # on edge-net too so the published port has a route back from the host
    # (a container only on internal networks can't publish reliably)
    networks: [it-net, edge-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health.php || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

  # --- the water + power soft-PLCs (Modbus) + their operator HMI --------
  field-plc:
    <<: *common
    build: ./field-plc
    container_name: packetriver-field-plc
    depends_on:
      scoring: { condition: service_healthy }
    environment:
      MODBUS_WRITE_OPEN: "${MODBUS_WRITE_OPEN:-1}"
      HMI_USER: "operator"
      HMI_PASS: "operator"      # default creds; Phase 4 hardening rotates this
    volumes:
      - pkt-flags:/run/secret:ro
    ports:
      - "127.0.0.1:8093:8093"    # operator HMI
      - "127.0.0.1:5502:502"     # water Modbus/TCP
      - "127.0.0.1:5503:503"     # power Modbus/TCP
    networks: [it-net, edge-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8093/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

  # --- the boxed-in attacker workstation --------------------------------
  player:
    <<: *common
    build: ./player
    container_name: packetriver-player
    cap_add: [NET_ADMIN]
    depends_on:
      websites: { condition: service_healthy }
    networks: [it-net]               # Phase 4 hardening moves this to edge-net + a real pivot
    healthcheck:
      test: ["CMD-SHELL", "command -v sqlmap >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- event bus AND a deliberately-open MQTT target ------------------
  # On edge-net as well so its published port has a route back from the host
  # (a container attached only to internal networks cannot publish reliably).
  bus:
    <<: *common
    image: eclipse-mosquitto:2
    container_name: packetriver-bus
    volumes:
      - ./bus/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:1883:1883"
    networks: [bus-net, it-net, edge-net]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t healthcheck -m ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

networks:
  edge-net:
    driver: bridge
    ipam: { config: [{ subnet: 172.31.10.0/24 }] }
  it-net:
    driver: bridge
    internal: true
    ipam: { config: [{ subnet: 172.31.20.0/24 }] }
  bus-net:
    driver: bridge
    internal: true
    ipam: { config: [{ subnet: 172.31.40.0/24 }] }

volumes:
  scoring-data:
  db-data:
  pkt-flags:
