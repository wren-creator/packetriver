# Packet Creek event bus.
#
# This broker does double duty: it carries the game's own events
# (pkt/score/*, pkt/sim/*, pkt/alert/*, pkt/reset, pkt/campaign) AND it is a
# deliberately-open target for the traffic-light district (pkt/traffic/#).
#
# FLAT build: anonymous, no ACL. The hardened build (docker-compose.segmented.yml,
# Phase 4) swaps in an acl_file that locks each pkt/* topic to its rightful
# publisher and password-gates pkt/traffic/#.

listener 1883
allow_anonymous true
persistence false
log_dest stdout
log_type warning
log_type notice
