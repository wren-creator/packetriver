# Packet River event bus - HARDENED (docker-compose.segmented.yml).
#
# Anonymous access is off, every client authenticates, and an acl_file scopes
# each pkt/* topic to its owner. The traffic-light district's "just publish to
# pkt/traffic/#" attack is refused here.

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence false
log_dest stdout
log_type warning
log_type notice
