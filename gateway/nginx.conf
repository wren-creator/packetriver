worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;   # the gateway still says "Server: nginx", but no version;
                       # the per-vhost Server / X-Powered-By below is the tell

  # JSON access log for the Alert-Level tailer (Phase 4 mounts a shared volume
  # here). Kept on stdout too so `docker logs` shows traffic.
  log_format pkt_json escape=json
    '{"ts":"$time_iso8601","ip":"$remote_addr","host":"$host",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"ua":"$http_user_agent","bytes":$body_bytes_sent,"rt":$request_time}';
  access_log /var/log/nginx/access.json pkt_json;
  access_log /dev/stdout pkt_json;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream simmap   { server simmap:8000; }
  upstream scoring  { server scoring:8001; }
  upstream websites { server websites:80; }

  # --- vhost routing for *.packetriver.range -----------------------------
  # The Main Street shop CNAMEs point at the gateway (not straight at
  # `websites`), so recon by name goes through here. Each shop is one
  # subdirectory of the shared `websites` container, but nginx hands each a
  # distinct `Server` / `X-Powered-By` so app-layer fingerprinting still tells
  # them apart. An unknown *.packetriver.range name just gets the map.
  map $host $vroot {
    default                          /;
    generalstore.packetriver.range   /generalstore/;
    hardware.packetriver.range       /hardware/;
    pharmacy.packetriver.range       /pharmacy/;
    diner.packetriver.range          /diner/;
    barber.packetriver.range         /barber/;
    tavern.packetriver.range         /tavern/;
    cleaners.packetriver.range       /drycleaner/;
    baittackle.packetriver.range     /baittackle/;
    townhall.packetriver.range       /townhall/;
    pd.packetriver.range             /police/;
    fd.packetriver.range             /fire/;
  }
  map $host $vupstream {
    default                          http://simmap;
    generalstore.packetriver.range   http://websites;
    hardware.packetriver.range       http://websites;
    pharmacy.packetriver.range       http://websites;
    diner.packetriver.range          http://websites;
    barber.packetriver.range         http://websites;
    tavern.packetriver.range         http://websites;
    cleaners.packetriver.range       http://websites;
    baittackle.packetriver.range     http://websites;
    townhall.packetriver.range       http://websites;
    pd.packetriver.range             http://websites;
    fd.packetriver.range             http://websites;
  }
  map $host $vserver {
    default                          "nginx";
    generalstore.packetriver.range   "Apache/2.4.62 (Debian)";
    hardware.packetriver.range       "nginx/1.24.0";
    pharmacy.packetriver.range       "Apache/2.4.58 (Ubuntu)";
    diner.packetriver.range          "Apache/2.4.41 (Ubuntu)";
    barber.packetriver.range         "LiteSpeed";
    tavern.packetriver.range         "Apache/2.4.62 (Debian)";
    cleaners.packetriver.range       "nginx/1.18.0 (Ubuntu)";
    baittackle.packetriver.range     "Apache/2.4.62 (Debian)";
    townhall.packetriver.range       "Apache/2.4.62 (Debian)";
    pd.packetriver.range             "nginx/1.24.0";
    fd.packetriver.range             "Apache/2.4.62 (Debian)";
  }
  map $host $vpb {
    default                          "";
    generalstore.packetriver.range   "PHP/8.2.20";
    hardware.packetriver.range       "PHP/8.1.29";
    pharmacy.packetriver.range       "PHP/7.4.33";
    diner.packetriver.range          "PHP/8.0.30";
    tavern.packetriver.range         "PHP/8.2.20";
    baittackle.packetriver.range     "PHP/8.1.29";
    townhall.packetriver.range       "PHP/8.2.20";
    fd.packetriver.range             "PHP/8.2.20";
  }

  server {
    listen 80 default_server;
    server_name _;

    # scoring API (flag submission, leaderboard, campaign codes)
    location /api/score/ {
      proxy_pass http://scoring;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # realtime town state
    location /ws {
      proxy_pass http://simmap;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 1h;
    }

    # everything else: the map UI + /api/state + /health + /directory + /hints
    location / {
      proxy_pass http://simmap;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name "~^[a-z0-9-]+(\.[a-z0-9-]+)?\.packetriver\.range$";

    location /api/score/ {
      proxy_pass http://scoring;
      proxy_set_header Host $host;
    }

    location / {
      proxy_hide_header Server;
      proxy_hide_header X-Powered-By;
      add_header Server $vserver always;
      add_header X-Powered-By $vpb always;
      rewrite ^/(.*)$ $vroot$1 break;
      proxy_pass $vupstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
    }
  }
}
