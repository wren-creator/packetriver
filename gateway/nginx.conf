worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # JSON access log for the Alert-Level tailer (Phase 4 mounts a shared volume
  # here). Kept on stdout too so `docker logs` shows traffic.
  log_format pkt_json escape=json
    '{"ts":"$time_iso8601","ip":"$remote_addr","host":"$host",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"ua":"$http_user_agent","bytes":$body_bytes_sent,"rt":$request_time}';
  access_log /var/log/nginx/access.json pkt_json;
  access_log /dev/stdout pkt_json;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream simmap  { server simmap:8000; }
  upstream scoring { server scoring:8001; }

  server {
    listen 80 default_server;

    # scoring API (flag submission, leaderboard, campaign codes)
    location /api/score/ {
      proxy_pass http://scoring;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # realtime town state
    location /ws {
      proxy_pass http://simmap;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 1h;
    }

    # everything else: the map UI + /api/state + /health, served by simmap
    location / {
      proxy_pass http://simmap;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
