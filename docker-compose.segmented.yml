# Packet River - HARDENED topology.
#
#   ./start.sh --segmented
#
# Folded on top of docker-compose.yml. Every deliberate weakness is turned off
# so you can run the same attacks and watch them fail:
#
#   * field PLCs re-assert their safe state every scan (MODBUS_WRITE_OPEN=0),
#     so unauth Modbus writes get stomped within a tick
#   * the broker requires auth and scopes every pkt/* topic (acl_file), so the
#     anonymous publish to pkt/traffic/# is refused
#   * default credentials and PINs are rotated off their shipped values
#   * verbose DB errors and predictable session tokens are off
#
# The full "and here is why" writeups are in docs/scenarios.md.

services:

  bus:
    volumes:
      - ./bus/mosquitto.segmented.conf:/mosquitto/config/mosquitto.conf:ro
      - ./bus/passwd.segmented:/mosquitto/config/passwd:ro
      - ./bus/acl.segmented:/mosquitto/config/acl:ro
    # the flat healthcheck publishes anonymously; the hardened broker refuses
    # that, so authenticate as simmap (to a pkt/ topic it is ACL-allowed).
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -u simmap -P simmap-seg-2f9a1 -t pkt/healthcheck -m ok || exit 1"]

  simmap:
    environment:
      MQTT_USER: "simmap"
      MQTT_PASS: "simmap-seg-2f9a1"

  scoring:
    environment:
      MQTT_USER: "scoring"
      MQTT_PASS: "scoring-seg-7c3e0"

  websites:
    environment:
      VERBOSE_ERRORS: "0"
      WEAK_SESSIONS: "0"

  field-plc:
    environment:
      MODBUS_WRITE_OPEN: "0"
      HMI_PASS: "R1ver-Ops-2026"

  factory-snmp:
    environment:
      SNMP_HARDENED: "1"           # no write community; ro community off `public`
      SNMP_RO_COMMUNITY: "pkw-ro-8831"
    healthcheck:
      test: ["CMD-SHELL", "snmpget -v2c -c pkw-ro-8831 -t 2 -r 1 udp:127.0.0.1:161 .1.3.6.1.4.1.53864.1.4.0 >/dev/null 2>&1 || exit 1"]

  traffic-plc:
    environment:
      MQTT_USER: "signals"
      MQTT_PASS: "signals-seg-b41d8"
      ENG_PIN: "83017"

  rail-plc:
    environment:
      MQTT_USER: "railops"
      MQTT_PASS: "railops-seg-9e6f2"
      CONSOLE_USER: "rsc_maint"
      CONSOLE_PASS: "sw1tch-Key-2026"
      RAIL_CREW_USER: "rse.kmiller"
      RAIL_CREW_PASS: "Sw-9931-Kf-rotated"   # so an old capture's cred is dead

  # --- web-tier + mainframe hardening flags ---
  bank:
    environment:
      JWT_STRICT: "1"                # reject alg:none, pin HS256

  paygw:
    environment:
      RECEIPT_AUTH: "1"             # bearer token required on /receipt/<txn>

  as400:
    environment:
      MOCK_AS400_HARDENED: "1"      # blank sign-on rejected (QSECURITY 40+)

  z16:
    environment:
      MOCK_Z16_HARDENED: "1"       # the never-revoked IBMUSER is revoked

  # --- Phase 5 network-attack lanes ---
  netlab:
    environment:
      NETLAB_TLS: "1"              # portal -> HTTPS :443, mail -> POP3S :995
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1:443/health >/dev/null 2>&1 || exit 1"]

  netlab-patron:
    environment:
      NETLAB_TLS: "1"

  soho-router:
    environment:
      ADMIN_PASS: "hr24-9f2c-rotated"   # off the shipped default
      WAN_ADMIN: "0"                    # admin only from the home LAN
      PORTAL_TLS: "1"                   # crew portal is TLS; the capture is opaque

  soho-resident:
    environment:
      CREW_PASS: "Sw-9931-Kf-rotated"

# Still open (see ROADMAP.md): a real span-port IDS. A Suricata container on a
# Docker bridge only sees its own + broadcast traffic, so an inline sensor that
# actually catches the Modbus writes / the MQTT publishes / the AXFR needs a
# different network topology (a mirror interface or a router container). Today
# the "and here's what catches it" story is logtail.py on the gateway access
# log + the broker ACLs + the field-plc golden re-assert.
