# Widget Works line-management SNMP agent.
#
# THE BUG: default community strings, and a read-write community at that.
# `public` reads everything; `private` writes the line-control OIDs. The
# segmented build (SNMP_HARDENED=1, wired in entrypoint.sh) drops the
# rwcommunity and moves the ro community off `public`.

agentAddress udp:161

rocommunity public
rwcommunity private

sysLocation  Widget Works - Line & Loading (SNMP mgmt still on defaults - ticket PKW-411)
sysContact   ops@widgetworks.packetriver.range
sysName      widgetworks-linemgmt

# custom line-management subtree, served by ops.py
pass_persist .1.3.6.1.4.1.53864.1  /usr/local/bin/ops.py
