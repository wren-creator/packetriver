<VirtualHost *:80>
    ServerName main.town.local
    DocumentRoot /var/www/site

    <Directory /var/www/site>
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        Options -Indexes
    </Directory>

    # the drycleaner left a working git checkout in the web root - browsable
    <Directory /var/www/site/drycleaner/.git>
        Require all granted
        Options +Indexes
    </Directory>

    # show the diner's leftover .sql backup as text instead of a download
    AddType text/plain .sql

    # the map UI (served from another port) embeds these in a panel
    Header always unset X-Frame-Options
    # the barber "manager bot" token, for review.php
    PassEnv BARBER_MGR_TOKEN

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
