<VirtualHost *:80>
    ServerName generalstore.town.local
    DocumentRoot /var/www/generalstore

    <Directory /var/www/generalstore>
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # the map UI (served from another port) embeds the storefront in a panel
    Header always unset X-Frame-Options

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
